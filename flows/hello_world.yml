id: hello_world
namespace: dev2

inputs:
  - id: greeting
    type: STRING
    defaults: kestra

tasks:
  - id: welcome
    type: io.kestra.plugin.core.log.Log
    message: welcome to {{ inputs.greeting }}

  - id: buy
    type: io.kestra.plugin.core.log.Log
    message: bye from {{ inputs.greeting }}    